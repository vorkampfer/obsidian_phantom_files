[project]
name = "obsidian-phantom"
version = "0.1.0"
description = "Find broken links, orphans, and junk files in an Obsidian vault."
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[project.scripts]
obsidian-phantom = "phantom.cli:main"
phantom = "phantom.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["phantom*"]
